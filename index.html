<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>中国象棋 · 双人在线对战</title>
  <style>
    :root {
      --bg-deep: #1a1410;
      --bg-panel: #241e18;
      --gold: #d4a854;
      --gold-dim: #a88634;
      --text: #e8ddd0;
      --text-dim: #a09080;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-canvas {
      display: block;
      touch-action: none;
      cursor: pointer;
    }

    /* ---------- 大厅 / 登录 容器 ---------- */
    #lobby {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel {
      background: linear-gradient(160deg, #2c241c, #1c1610);
      border: 2px solid var(--gold-dim);
      border-radius: 18px;
      padding: 30px 28px 26px;
      width: min(94vw, 460px);
      max-height: 92vh;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), 0 0 120px rgba(139, 105, 20, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      animation: popIn 0.35s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .panel h1 {
      font-size: 1.6em;
      color: var(--gold);
      letter-spacing: 6px;
      text-shadow: 0 0 20px rgba(212, 168, 84, 0.3);
      margin-bottom: 4px;
    }

    .panel .sub {
      font-size: 0.82em;
      color: var(--text-dim);
      margin-bottom: 22px;
    }

    /* 登录 */
    .field {
      margin-bottom: 18px;
      text-align: left;
    }

    .field label {
      display: block;
      font-size: 0.78em;
      color: var(--text-dim);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--gold-dim);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      font-size: 1em;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus {
      border-color: var(--gold);
    }

    .field input::placeholder {
      color: #6a5b4a;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: var(--bg-deep);
      font-size: 1.05em;
      font-weight: bold;
      letter-spacing: 4px;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
      font-family: inherit;
    }

    .primary-btn:hover {
      transform: scale(1.02);
      filter: brightness(1.08);
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    /* 大厅头部：我的信息 */
    .me-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(212, 168, 84, 0.25);
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: #1a1410;
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    }

    .me-row .info {
      text-align: left;
      flex: 1;
      min-width: 0;
    }

    .me-row .info .nm {
      font-weight: bold;
      font-size: 0.95em;
    }

    .me-row .info .st {
      font-size: 0.75em;
      color: #64c8ff;
    }

    .me-row .logout-btn {
      padding: 6px 12px;
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      font-size: 0.78em;
      font-family: inherit;
    }

    /* 在线玩家列表 */
    .list-title {
      font-size: 0.82em;
      color: var(--text-dim);
      text-align: left;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .player-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      margin: 0 -6px;
      padding: 0 6px;
    }

    .player-list::-webkit-scrollbar {
      width: 4px;
    }

    .player-list::-webkit-scrollbar-thumb {
      background: var(--gold-dim);
      border-radius: 2px;
    }

    .player-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(212, 168, 84, 0.18);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .player-item:hover {
      background: rgba(212, 168, 84, 0.12);
      border-color: var(--gold-dim);
    }

    .player-item .avatar {
      background: linear-gradient(135deg, #3a6ea5, #274c73);
      color: #e8f0ff;
    }

    .player-item .nm {
      flex: 1;
      text-align: left;
      font-size: 0.95em;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-item .status {
      font-size: 0.72em;
      color: var(--text-dim);
    }

    .empty-tip {
      text-align: center;
      color: #6a5b4a;
      padding: 30px 0;
      font-size: 0.85em;
    }

    /* 邀请等待条 */
    .invite-pending {
      padding: 10px 14px;
      margin-top: 12px;
      background: rgba(100, 200, 255, 0.1);
      border: 1px solid rgba(100, 200, 255, 0.3);
      border-radius: 10px;
      font-size: 0.85em;
      color: #64c8ff;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .invite-pending button {
      padding: 5px 14px;
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      font-size: 0.8em;
      font-family: inherit;
      white-space: nowrap;
    }

    /* ---------- 模态确认弹窗 ---------- */
    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
    }

    .modal-mask.active {
      display: flex;
    }

    .modal-box {
      background: linear-gradient(160deg, #2c241c, #1c1610);
      border: 2px solid var(--gold-dim);
      border-radius: 16px;
      padding: 26px 24px;
      width: min(88vw, 360px);
      text-align: center;
      animation: popIn 0.3s ease;
    }

    .modal-box .t {
      font-size: 1.05em;
      font-weight: bold;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .modal-box .d {
      font-size: 0.82em;
      color: var(--text-dim);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .modal-btns {
      display: flex;
      gap: 10px;
    }

    .modal-btns button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-size: 0.95em;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }

    .modal-btns .ok {
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: var(--bg-deep);
    }

    .modal-btns .cancel {
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-dim);
      border: 1px solid rgba(139, 105, 20, 0.4);
    }

    /* ---------- Toast ---------- */
    #toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(36, 30, 24, 0.95);
      border: 1px solid var(--gold-dim);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 0.9em;
      z-index: 70;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      max-width: 86vw;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <canvas id="game-canvas"></canvas>

  <!-- 大厅：登录 + 在线玩家列表 -->
  <div id="lobby">
    <!-- 登录视图 -->
    <div class="panel" id="login-panel">
      <h1>中国象棋</h1>
      <div class="sub">双人在线对战</div>
      <div class="field">
        <label for="input-name">你的昵称</label>
        <input id="input-name" type="text" maxlength="12" placeholder="请输入昵称" autocomplete="off">
      </div>
      <button class="primary-btn" id="login-btn">进入大厅</button>
    </div>

    <!-- 大厅视图 -->
    <div class="panel" id="lobby-panel" style="display:none">
      <h1>在线大厅</h1>
      <div class="sub">点击在线玩家头像邀请对战</div>
      <div class="me-row">
        <div class="avatar" id="me-avatar"></div>
        <div class="info">
          <div class="nm" id="me-name"></div>
          <div class="st" id="me-status">在线</div>
        </div>
        <button class="logout-btn" id="logout-btn">退出</button>
      </div>
      <div class="list-title">在线玩家（<span id="online-count">0</span>）</div>
      <div class="player-list" id="player-list"></div>
      <div class="invite-pending" id="invite-pending">
        <span id="invite-pending-text">等待对方接受...</span>
        <button id="invite-cancel-btn">取消</button>
      </div>
    </div>
  </div>

  <!-- 模态弹窗：邀请确认 / 收到邀请 -->
  <div class="modal-mask" id="modal">
    <div class="modal-box">
      <div class="t" id="modal-title"></div>
      <div class="d" id="modal-desc"></div>
      <div class="modal-btns" id="modal-btns"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
